[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pymod"
version = "0.1.0"
description = "A restricted-Python-DSL compiler that emits Minecraft Data Packs, KubeJS scripts, and compilable Fabric Java mods."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []
# Intentionally stdlib-only (ast, argparse, dataclasses, json, pathlib). Keeps install trivial
# and the tool chain self-contained -- no third-party codegen/runtime deps to drift.

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pymod = ["gameprofiles.json"]

[project.scripts]
pymod = "pymod.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"